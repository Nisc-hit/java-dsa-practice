<!DOCTYPE html>
<html>
<head>
    <title>Counter Demo</title>
</head>
<body>
    <h1 id="counterDisplay">0</h1>
    <button onclick="increment()">+1</button>
    <script>
        let count = 0;
        function increment() {
            count++;
            document.getElementById("counterDisplay").innerText = count;
        }
    </script>
</body>
</html>
