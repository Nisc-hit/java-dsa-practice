<!DOCTYPE html>
<html>
<head>
    <title>Variables Demo</title>
</head>
<body>
    <h1>Check the browser console (F12)</h1>
    <script>
        let name = "Nischit";
        let age = 21;
        const country = "India"; // const cannot be reassigned later
        console.log("Name: " + name);
        console.log("Age: " + age);
        console.log("Country: " + country);
    </script>
</body>
</html>
