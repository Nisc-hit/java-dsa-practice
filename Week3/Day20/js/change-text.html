<!DOCTYPE html>
<html>
<head>
    <title>Change Text Demo</title>
</head>
<body>
    <p id="myParagraph">Original text</p>
    <button onclick="changeText()">Click Me</button>
    <script>
        function changeText() {
            document.getElementById("myParagraph").innerText = "Text has been changed!";
        }
    </script>
</body>
</html>
