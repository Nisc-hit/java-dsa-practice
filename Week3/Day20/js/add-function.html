<!DOCTYPE html>
<html>
<head>
    <title>Add Function Demo</title>
</head>
<body>
    <h1 id="result">Result will appear here</h1>
    <script>
        function addNumbers(a, b) {
            return a + b;
        }
        let sum = addNumbers(5, 10);
        document.getElementById("result").innerText = "Sum = " + sum;
    </script>
</body>
</html>
